# SPURS task ELFs of the firmware codecs (not in EBOOT.ELF): lifted from
# spu_tasks/spu_task_<fp>.elf, written by one run with
# PS3_SPU_TASK_DUMP=$PWD/spu_tasks. Missing file = the task stays interpreted.
# Measured 2026-09-26 in the intro movies (PS3_TRACE_SPU_TASK): a1acac runs to
# EXIT without parking and takes ~50% of the interpreter's time. (96e96c, the
# next one, loads overlays at LS 0x3080 -- not liftable as one image.)
[[task]]
name = "task_a1acac"
fp = 0xa1acacde5c1d9cbd

